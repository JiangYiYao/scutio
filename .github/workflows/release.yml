name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SCUTIO_TEST_REPORT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m ruff check scripts skills/scutio/scripts tests
      - run: python -m ruff format --check scripts skills/scutio/scripts tests
      - run: python -m pytest -q tests -m 'not live' -p no:cacheprovider
      - name: Build clean preview
        run: python scripts/build_release.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: scutio-preview
          path: dist/scutio-*
          if-no-files-found: error

  package-smoke:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: scutio-preview
          path: dist
      - name: Verify and unpack archive
        shell: python
        run: |
          import hashlib, pathlib, zipfile
          archive, = pathlib.Path('dist').glob('*.zip')
          expected = archive.with_suffix('.zip.sha256').read_text().split()[0]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall('installed skills')
      - name: Install recorded dependencies
        run: python -m pip install -r "installed skills/scutio/requirements.txt" -c "installed skills/scutio/tested-constraints.txt"
      - name: Probe unpacked skill
        run: python -B "installed skills/scutio/scripts/runtime_probe.py"
      - name: Check standalone entry points
        run: |
          python "installed skills/scutio/scripts/collectors/collect_research_base.py" --help
          python "installed skills/scutio/scripts/journal.py" --help
          python "installed skills/scutio/scripts/data_sources.py" --help
